<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voicebox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.06);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #e0e0e0;
      --text-dim: #666;
      --text-faint: #444;
      --radius: 10px;
      --radius-sm: 8px;
      --radius-pill: 20px;
    }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    /* ─── Header ─── */
    .header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
    }
    .logo {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: white;
    }
    .header h1 { font-size: 16px; font-weight: 700; color: #fff; }
    .header p { font-size: 11px; color: var(--text-dim); }

    /* ─── Page info ─── */
    .page-info {
      font-size: 12px; color: var(--text-dim); line-height: 1.4;
      padding: 10px 12px; background: var(--surface); border-radius: var(--radius-sm);
      border-left: 2px solid var(--accent);
      margin-bottom: 16px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ─── Buttons ─── */
    .btn-primary {
      width: 100%; padding: 12px; border-radius: var(--radius);
      background: var(--accent); border: none; color: white;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px rgba(99,102,241,0.3);
    }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-secondary {
      padding: 8px 16px; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); font-size: 12px; cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-secondary:hover { background: var(--surface-hover); color: var(--text); }

    /* ─── Section label ─── */
    .section-label {
      font-size: 10px; font-weight: 600; color: var(--text-faint);
      text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 8px; margin-top: 16px;
    }
    .section-label:first-of-type { margin-top: 0; }

    /* ─── Voice rail ─── */
    .voice-rail {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .voice-rail::-webkit-scrollbar { display: none; }

    .voice-chip {
      flex-shrink: 0; display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: var(--radius-pill);
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
    }
    .voice-chip:hover { background: var(--surface-hover); color: var(--text); }
    .voice-chip.selected {
      background: rgba(99,102,241,0.15); border-color: var(--accent);
      color: #818cf8;
    }
    .voice-chip .tag {
      font-size: 9px; opacity: 0.5; font-weight: 600;
    }
    .voice-chip .preview-btn {
      display: flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(255,255,255,0.06); cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .voice-chip .preview-btn:hover { background: rgba(255,255,255,0.15); }
    .voice-chip .preview-btn svg { width: 10px; height: 10px; fill: currentColor; }
    .voice-chip.previewing .preview-btn {
      background: var(--accent); animation: pulse 1s ease infinite;
    }
    @keyframes pulse { 50% { opacity: 0.5; } }

    /* ─── Speed row ─── */
    .speed-row {
      display: flex; gap: 4px;
    }
    .speed-option {
      flex: 1; padding: 6px; border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); font-size: 12px; font-weight: 600;
      text-align: center; cursor: pointer; transition: all 0.15s;
    }
    .speed-option:hover { background: var(--surface-hover); color: var(--text); }
    .speed-option.selected {
      background: rgba(99,102,241,0.15); border-color: var(--accent);
      color: #818cf8;
    }

    /* ─── Player view ─── */
    .player-status {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }
    .status-dot.paused { background: #f59e0b; }
    .status-dot.loading { background: #3b82f6; animation: pulse 1s ease infinite; }
    .status-dot.error { background: #ef4444; }
    .status-text { font-size: 13px; font-weight: 600; color: var(--text); }
    .status-detail { font-size: 11px; color: var(--text-dim); margin-left: auto; }

    .progress-track {
      width: 100%; height: 3px; background: rgba(255,255,255,0.06);
      border-radius: 2px; overflow: hidden; margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width 0.3s ease; width: 0%;
    }

    .player-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-bottom: 16px;
    }
    .btn-play {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent); border: none; color: white;
      font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .btn-play:hover { background: var(--accent-hover); transform: scale(1.05); }
    .btn-play:active { transform: scale(0.95); }

    .btn-stop {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .btn-stop:hover { background: rgba(239,68,68,0.15); border-color: #ef4444; color: #ef4444; }

    /* ─── Now playing text ─── */
    .now-playing {
      font-size: 11px; color: var(--text-dim); line-height: 1.4;
      padding: 8px 12px; background: var(--surface); border-radius: var(--radius-sm);
      margin-bottom: 12px; font-style: italic;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ─── Keyboard hint ─── */
    .shortcut-hint {
      text-align: center; font-size: 10px; color: var(--text-faint);
      margin-top: 16px;
    }
    .shortcut-hint kbd {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; padding: 2px 5px;
      font-size: 9px; font-family: inherit; color: var(--text-dim);
    }

    /* ─── Error ─── */
    .error-msg {
      background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius-sm); padding: 8px 12px;
      font-size: 12px; color: #ef4444; margin-top: 12px; line-height: 1.4;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">V</div>
    <div>
      <h1>Voicebox</h1>
      <p>Read any article aloud</p>
    </div>
  </div>

  <!-- Idle view -->
  <div id="idle-view">
    <div class="page-info" id="page-title">Loading page...</div>

    <button class="btn-primary" id="btn-start">Read Aloud</button>

    <div class="section-label">Voice</div>
    <div class="voice-rail" id="idle-voice-rail"></div>

    <div class="section-label">Speed</div>
    <div class="speed-row" id="idle-speed-row"></div>

    <div class="shortcut-hint">
      <kbd>Alt+Shift+R</kbd> to read from anywhere
    </div>
  </div>

  <!-- Player view -->
  <div id="player-view" class="hidden">
    <div class="player-status">
      <div class="status-dot" id="status-dot"></div>
      <div class="status-text" id="status-text">Playing</div>
      <div class="status-detail" id="status-detail"></div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="now-playing" id="now-playing"></div>

    <div class="player-controls">
      <button class="btn-stop" id="btn-stop" title="Stop">&#x2715;</button>
      <button class="btn-play" id="btn-play" title="Play/Pause">&#x25B6;</button>
    </div>

    <div class="section-label">Voice</div>
    <div class="voice-rail" id="playing-voice-rail"></div>

    <div class="section-label">Speed</div>
    <div class="speed-row" id="playing-speed-row"></div>
  </div>

  <!-- Error -->
  <div id="error-container" class="hidden">
    <div class="error-msg" id="error-message"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
